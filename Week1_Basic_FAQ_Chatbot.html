<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 - Basic FAQ Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 20px;
        }

        .chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            margin-bottom: 10px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.bot .message-bubble {
            background: #f1f1f1;
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .input-container {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }

        .send-btn:hover {
            background: #764ba2;
        }

        .welcome-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <div class="header">
            <h1>🤖 FAQ Chatbot</h1>
            <p>Week 1 - Basic Rule-Based</p>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="welcome-message">
                👋 Hi! I'm your FAQ assistant. Ask me about fees, timings, contact, or admission!
            </div>
        </div>

        <div class="input-container">
            <input
                type="text"
                class="input-field"
                id="userInput"
                placeholder="Ask me anything..."
                onkeypress="if(event.key === 'Enter') sendMessage()"
            >
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // FAQ Database
        const faqs = {
            "fees": "Our course fees are ₹50,000 per semester. Payment can be made online or through bank transfer.",
            "tuition": "Tuition fees are ₹45,000 per semester, plus additional charges for materials and labs.",
            "cost": "Total cost including all fees is approximately ₹60,000 per semester.",
            "payment": "We accept payments through online banking, UPI, credit/debit cards, and cash at the office.",

            "timings": "Classes are held from 9:00 AM to 5:00 PM, Monday to Friday. Labs may extend to 6:00 PM.",
            "schedule": "Regular schedule: 9 AM - 1 PM lectures, 2 PM - 5 PM practical sessions.",
            "hours": "College operates from 8:00 AM to 6:00 PM on weekdays.",

            "contact": "You can reach us at: Phone: +91-1234567890, Email: info@college.edu",
            "phone": "Call us at +91-1234567890 during office hours (9 AM - 5 PM).",
            "email": "Email us at admissions@college.edu for inquiries.",

            "admission": "Admissions are open for Fall 2024. Apply online at our website.",
            "apply": "Visit our website to fill the online application form. Documents required: 10th/12th marksheets, ID proof.",
            "requirements": "Admission requirements: Minimum 60% in 12th grade, entrance exam qualification.",

            "location": "We are located at 123 College Street, Education City, State - 123456.",
            "address": "Our campus address is: 123 College Street, Education City, State - 123456."
        };

        // Send message function
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim().toLowerCase();

            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            // Get bot response
            const response = getBotResponse(message);
            addMessage(response, 'bot');
        }

        // Get bot response using keyword matching
        function getBotResponse(userInput) {
            const input = userInput.toLowerCase();

            // Simple keyword matching
            for (const keyword in faqs) {
                if (input.includes(keyword)) {
                    return faqs[keyword];
                }
            }

            // Default responses
            if (input.includes('hello') || input.includes('hi') || input.includes('hey')) {
                return "Hello! How can I help you with information about fees, timings, contact, or admission?";
            }

            if (input.includes('thank')) {
                return "You're welcome! Feel free to ask if you have more questions.";
            }

            // Fallback
            return "I'm sorry, I don't have information about that. I can help with fees, timings, contact details, and admission procedures.";
        }

        // Add message to chat
        function addMessage(text, sender) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            messageDiv.innerHTML = `
                <div class="message-bubble">${text}</div>
            `;

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
