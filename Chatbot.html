<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Chatbot - Query Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 20px;
        }
        
        .chatbot-container {
            width: 100%;
            max-width: 1200px;
            height: 98vh;
            max-height: 1000px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #764ba2;
        }
        
        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }
        
        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.bot .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 4px;
        }
        
        .message.bot {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        
        .bot-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .input-container {
            background: white;
            border-top: 1px solid #ddd;
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .input-field {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 12px 16px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-field:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.3s, transform 0.2s;
        }
        
        .send-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }
        
        .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            text-align: center;
        }
        
        .welcome-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        
        .suggestion-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 0;
            justify-content: center;
        }
        
        .chip {
            background: #e0e7ff;
            color: #667eea;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s, transform 0.2s;
            border: 1px solid #667eea;
        }
        
        .chip:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .context-indicator {
            font-size: 11px;
            color: #2196F3;
            margin-top: 4px;
            font-weight: 600;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
        }
        
        .typing-indicator .bot-avatar {
            margin-right: 10px;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="chatbot-container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 CSE Chatbot</h1>
            <p>Ask me about courses, exams & schedules</p>
        </div>
        
        <!-- Messages -->
        <div class="messages-container" id="messagesContainer"></div>
        
        <!-- Input -->
        <div class="input-container">
            <input 
                type="text" 
                class="input-field" 
                id="inputField" 
                placeholder="Ask me anything..."
                onkeypress="if(event.key === 'Enter') sendMessage()"
            >
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // Course Database
        const courseDatabase = {
            1: [
                { code: 'CSE101', name: 'Programming Fundamentals', date: '15/01/2026' },
                { code: 'CSE102', name: 'Mathematics I', date: '18/01/2026' }
            ],
            2: [
                { code: 'CSE201', name: 'Data Structures', date: '22/02/2026' },
                { code: 'CSE202', name: 'Database Basics', date: '24/02/2026' }
            ],
            3: [
                { code: 'CSE301', name: 'Web Development', date: '18/03/2026' },
                { code: 'CSE302', name: 'Operating Systems', date: '21/03/2026' }
            ],
            4: [
                { code: 'CSE401', name: 'Software Engineering', date: '19/04/2026' },
                { code: 'CSE402', name: 'Computer Networks', date: '23/04/2026' }
            ],
            5: [
                { code: 'CSE501', name: 'Artificial Intelligence', date: '16/05/2026' },
                { code: 'CSE502', name: 'Machine Learning', date: '20/05/2026' }
            ],
            6: [
                { code: 'CSE601', name: 'Cloud Computing', date: '17/06/2026' },
                { code: 'CSE602', name: 'Cybersecurity', date: '21/06/2026' }
            ],
            7: [
                { code: 'CSE701', name: 'Mobile Development', date: '15/07/2026' },
                { code: 'CSE702', name: 'Big Data Analytics', date: '19/07/2026' }
            ],
            8: [
                { code: 'CSE801', name: 'Project Management', date: '22/08/2026' },
                { code: 'CSE802', name: 'Advanced Algorithms', date: '25/08/2026' }
            ]
        };

        // Context for multi-turn conversations
        let conversationContext = {
            currentSemester: null,
            lastCourses: [],
            history: []
        };

        // Keyword to course mapping
        const keywordMap = {
            'programming|fundamentals': 'CSE101',
            'mathematics|math': 'CSE102',
            'data structures|structures': 'CSE201',
            'database|databases|db': 'CSE202',
            'web|website|html|css': 'CSE301',
            'operating|system|os': 'CSE302',
            'software|engineering': 'CSE401',
            'network|networking|internet': 'CSE402',
            'artificial|intelligence|ai': 'CSE501',
            'machine learning|ml': 'CSE502',
            'cloud|server': 'CSE601',
            'security|cyber': 'CSE602',
            'mobile|app|android': 'CSE701',
            'big data|data analytics': 'CSE702',
            'project management': 'CSE801',
            'algorithm|algorithms': 'CSE802'
        };

        // Initialize bot
        window.addEventListener('load', () => {
            addMessage('bot', '👋 Hi! I\'m your CSE Course Assistant. Ask me about courses, exams, or schedules!');
            addSuggestionChips(['What courses in sem 5?', 'When is AI exam?', 'Show all subjects']);
        });

        // Send message
        function sendMessage() {
            const input = document.getElementById('inputField');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Remove suggestion chips
            removeSuggestionChips();
            
            // Add user message
            addMessage('user', message);
            input.value = '';
            
            // Show typing indicator
            showTypingIndicator();
            
            // Get bot response with small delay for natural feel
            setTimeout(() => {
                hideTypingIndicator();
                const response = getBotResponse(message);
                
                // Add bot response instantly
                addMessage('bot', response.text, response.context);
                
                // Add follow-up suggestions for some responses
                if (response.text.includes('Semester') || response.text.includes('Courses')) {
                    addSuggestionChips(['When are exams?', 'Tell me about AI', 'Show all subjects']);
                } else if (response.text.includes('exam') || response.text.includes('Exam')) {
                    addSuggestionChips(['What courses in sem 3?', 'Tell me about networks', 'Show all subjects']);
                }
            }, 500);
        }

        // Add message to chat
        function addMessage(sender, text, context = null) {
            const container = document.getElementById('messagesContainer');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            if (sender === 'bot') {
                messageDiv.innerHTML = `
                    <div class="bot-avatar">🤖</div>
                    <div class="message-bubble">
                        ${text}
                        ${context ? `<div class="context-indicator">${context}</div>` : ''}
                        <div class="timestamp">${timestamp}</div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-bubble">
                        ${text}
                        <div class="timestamp">${timestamp}</div>
                    </div>
                `;
            }
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="bot-avatar">🤖</div>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        // Add suggestion chips
        function addSuggestionChips(suggestions) {
            const container = document.getElementById('messagesContainer');
            const chipsDiv = document.createElement('div');
            chipsDiv.className = 'suggestion-chips';
            chipsDiv.id = 'suggestionChips';
            
            suggestions.forEach(suggestion => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.textContent = suggestion;
                chip.onclick = () => {
                    document.getElementById('inputField').value = suggestion;
                    sendMessage();
                };
                chipsDiv.appendChild(chip);
            });
            
            container.appendChild(chipsDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Remove suggestion chips
        function removeSuggestionChips() {
            const chips = document.getElementById('suggestionChips');
            if (chips) {
                chips.remove();
            }
        }

        // Get bot response - Keyword Independent
        function getBotResponse(userInput) {
            const lower = userInput.toLowerCase();
            
            // Extract semester from any context
            const semMatch = lower.match(/sem(?:ester)?\s*(\d)|(\d)(?:st|nd|rd|th)\s*semester/i);
            if (semMatch) {
                const sem = parseInt(semMatch[1] || semMatch[2]);
                if (sem >= 1 && sem <= 8) {
                    conversationContext.currentSemester = sem;
                }
            }
            
            // Smart course detection - look for any course-related terms
            let foundCourse = null;
            
            // Direct course code match
            for (let sem in courseDatabase) {
                const course = courseDatabase[sem].find(c => lower.includes(c.code.toLowerCase()));
                if (course) {
                    foundCourse = course;
                    conversationContext.lastCourses = [course.code];
                    break;
                }
            }
            
            // Keyword-based course detection (expanded)
            if (!foundCourse) {
                const courseKeywords = {
                    'programming|code|basic|fundamentals|beginner': 'CSE101',
                    'math|mathematics|calculus|algebra': 'CSE102',
                    'data structures|structures|data|linked list|tree|graph': 'CSE201',
                    'database|databases|sql|mysql|data storage|db': 'CSE202',
                    'web|website|html|css|javascript|frontend|backend': 'CSE301',
                    'operating|system|os|linux|windows|kernel': 'CSE302',
                    'software|engineering|development|process|methodology': 'CSE401',
                    'network|networking|internet|tcp|ip|communication': 'CSE402',
                    'artificial|intelligence|ai|robotics|smart': 'CSE501',
                    'machine learning|ml|neural|deep learning|prediction': 'CSE502',
                    'cloud|server|aws|azure|hosting|distributed': 'CSE601',
                    'security|cyber|cybersecurity|hacking|protection|encryption': 'CSE602',
                    'mobile|app|android|ios|phone|application': 'CSE701',
                    'big data|data analytics|analytics|hadoop|spark|processing': 'CSE702',
                    'project management|management|planning|team|leadership': 'CSE801',
                    'algorithm|algorithms|complexity|optimization|efficiency': 'CSE802'
                };
                
                for (const keyword in courseKeywords) {
                    if (new RegExp(`\\b${keyword}\\b`, 'i').test(lower)) {
                        const courseCode = courseKeywords[keyword];
                        for (let sem in courseDatabase) {
                            foundCourse = courseDatabase[sem].find(c => c.code === courseCode);
                            if (foundCourse) {
                                conversationContext.lastCourses = [courseCode];
                                break;
                            }
                        }
                        if (foundCourse) break;
                    }
                }
            }
            
            // Prepare response
            let responseText = '';
            let contextNote = '';
            
            // Intent detection - understand what user wants
            const intent = detectIntent(lower);
            
            if (foundCourse) {
                // Found specific course
                responseText = `
📚 <strong>${foundCourse.code}</strong> - ${foundCourse.name}
📅 Exam Date: <strong>${foundCourse.date}</strong>
                `;
            } else if (intent === 'semester_info' && conversationContext.currentSemester) {
                // Show semester courses
                const sem = conversationContext.currentSemester;
                let courseList = `📚 Semester ${sem} Courses:\n\n`;
                courseDatabase[sem].forEach(course => {
                    courseList += `📍 ${course.code} - ${course.name} (${course.date})\n`;
                });
                responseText = courseList;
                contextNote = `Using context: Semester ${sem}`;
            } else if (intent === 'exam_info') {
                if (conversationContext.currentSemester) {
                    const sem = conversationContext.currentSemester;
                    let examList = `📅 Exams in Semester ${sem}:\n\n`;
                    courseDatabase[sem].forEach(course => {
                        examList += `${course.code}: ${course.date}\n`;
                    });
                    responseText = examList;
                    contextNote = `Using context: Semester ${sem}`;
                } else {
                    // Show all upcoming exams
                    let examList = `📅 All Upcoming Exams:\n\n`;
                    const allExams = [];
                    for (let sem in courseDatabase) {
                        courseDatabase[sem].forEach(course => {
                            allExams.push({ code: course.code, name: course.name, date: course.date, sem: sem });
                        });
                    }
                    allExams.sort((a, b) => new Date(a.date) - new Date(b.date));
                    allExams.slice(0, 8).forEach(exam => {
                        examList += `${exam.code} (${exam.name}): ${exam.date}\n`;
                    });
                    responseText = examList;
                }
            } else if (intent === 'all_courses') {
                let allCourses = `📚 All CSE Courses:\n\n`;
                for (let sem = 1; sem <= 8; sem++) {
                    allCourses += `Sem ${sem}: `;
                    allCourses += courseDatabase[sem].map(c => c.code).join(', ');
                    allCourses += '\n';
                }
                responseText = allCourses;
            } else if (intent === 'greeting') {
                responseText = `👋 Hello! I'm your CSE Course Assistant. I can help you with:

• Course information (e.g., "Tell me about AI")
• Exam dates (e.g., "When are exams?")
• Semester schedules (e.g., "What courses in sem 5?")
• Study help (e.g., "Help me study")

Just ask me anything about CSE courses!`;
            } else if (intent === 'help') {
                responseText = `💡 I can help you with:

• 📚 Course details: "Tell me about machine learning"
• 📅 Exam schedules: "When is the database exam?"
• 🎓 Semester info: "What courses in semester 3?"
• 📖 All courses: "Show me all subjects"
• 🔍 Specific topics: "What about cybersecurity?"

Try asking naturally - I understand many ways to ask questions!`;
            } else {
                // Fallback - try to understand the intent
                if (lower.includes('course') || lower.includes('subject') || lower.includes('class')) {
                    responseText = `📚 I can tell you about any CSE course! Try asking:

• "What courses are in semester 5?"
• "Tell me about artificial intelligence"
• "Show me all CSE subjects"`;
                } else if (lower.includes('exam') || lower.includes('test') || lower.includes('date')) {
                    responseText = `📅 I can help with exam information! Try:

• "When is the database exam?"
• "Show me exam dates for sem 3"
• "When are the upcoming exams?"`;
                } else if (lower.includes('schedule') || lower.includes('timetable')) {
                    responseText = `📋 I can show you schedules! Try:

• "What's the schedule for semester 4?"
• "Show me the timetable"
• "What courses are available?"`;
                } else {
                    responseText = `🤔 I'm not sure what you're asking about. I can help with:

• Course information and details
• Exam dates and schedules  
• Semester course listings
• Study suggestions

Try asking something like "Tell me about AI" or "When are exams?"`;
                }
            }
            
            return {
                text: responseText,
                context: contextNote
            };
        }

        // Detect user intent from natural language
        function detectIntent(text) {
            if (/hello|hi|hey|greetings|start|begin/i.test(text)) {
                return 'greeting';
            } else if (/help|how|what can|assist|support/i.test(text)) {
                return 'help';
            } else if (/all|every|complete|full|entire|total/i.test(text) && /course|subject|class/i.test(text)) {
                return 'all_courses';
            } else if (/exam|test|date|when|schedule|timetable/i.test(text)) {
                return 'exam_info';
            } else if (/course|subject|class|semester|curriculum/i.test(text)) {
                return 'semester_info';
            }
            return 'general';
        }
    </script>
</body>
</html>
